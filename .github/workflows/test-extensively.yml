name: Test Extensively
on:
  workflow_call:
  workflow_dispatch:

jobs:
  test-jvm:
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-15, ubuntu-24.04 ]
        java-version: [17, 21]
        jdk-dist:
          - adopt-hotspot
          - temurin
#          - adopt-openj9
#          - zulu
    runs-on: ${{ matrix.os }}
    concurrency:
      group: build-${{ github.workflow }}-${{ matrix.os }}-${{ matrix.java-version }}-${{ matrix.jdk-dist }}-${{ github.event.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Restore Gradle test cache
        id: cache-test-result
        uses: actions/cache/restore@v4.2.4
        with:
          path: |
            ~/.gradle/caches/build-cache-1
            .github/.cache/test-extensively
          key: ${{ format('test-extensively-{0}-java-{1}-{2}-{3}', runner.os, matrix.java-version, matrix.jdk-dist, hashFiles('src/**', '**/*.gradle', '**/*.gradle.kts', '**/settings.gradle', '**/settings.gradle.kts', '**/gradle.properties', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', 'buildSrc/**/*.kt', '*.kts')) }}
      - name: Run tests
        id: run-tests
        if: steps.cache-test-result.outputs.cache-hit != 'true'
        uses: DanySK/build-check-deploy-gradle-action@4.0.43
        with:
          java-distribution: ${{ matrix.jdk-dist }}
          java-version: ${{ matrix.java-version }}
          build-command: |
            ./gradlew classes testClasses --parallel
          check-command: |
            ./gradlew test --continue
          should-run-codecov: false
      - name: Mark successful test cache
        if: steps.cache-test-result.outputs.cache-hit != 'true' && steps.run-tests.conclusion == 'success'
        run: |
          mkdir -p .github/.cache/test-extensively
          echo "ok" > .github/.cache/test-extensively/success
      - name: Save Gradle test cache
        if: steps.cache-test-result.outputs.cache-hit != 'true' && steps.run-tests.conclusion == 'success'
        uses: actions/cache/save@v4.2.4
        with:
          path: |
            ~/.gradle/caches/build-cache-1
            .github/.cache/test-extensively
          key: ${{ steps.cache-test-result.outputs.cache-primary-key }}
      - name: Skip tests on cache hit
        if: steps.cache-test-result.outputs.cache-hit == 'true'
        run: echo "Inputs unchanged since last successful run, skipping tests."
