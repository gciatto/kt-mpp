name: Update Node.js Versions Fallback
on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:

jobs:
  update-node-versions-fallback:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.DEPLOYMENT_TOKEN || github.token }}
      - name: Refresh bundled Node.js version fallback list
        uses: DanySK/build-check-deploy-gradle-action@4.0.47
        with:
          build-command: ./gradlew updateNodeVersionsFallback
          check-command: true
          should-run-codecov: false
      - name: Commit and push if the fallback list changed
        run: |
          FILE=src/main/resources/io/github/gciatto/kt/mpp/utils/node-versions-fallback.txt
          if git diff --quiet -- "$FILE"; then
            echo "Node.js version fallback list is already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$FILE"
            git commit -m "fix: refresh bundled Node.js version fallback list"
            git push
          fi
